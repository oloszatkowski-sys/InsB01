name: InstaLing Daily Bot

on:
  schedule:
    # 1. Poranny przegląd o godz. 06:30 czasu polskiego (Europe/Warsaw):
    # W czasie zimowym CET (UTC+1): 05:30 UTC ('30 5 * * *')
    # W czasie letnim CEST (UTC+2): 04:30 UTC ('30 4 * * *')
    # Skrypt sam weryfikuje godzinę w Polsce i nie powiela wykonania w ciągu tego samego dnia.
    - cron: '30 4,5 * * *'

    # 2. Popołudniowe okno sesji: uruchamianie co 10 minut między 14:00 a 22:00 w Polsce (13:00 - 21:00 UTC)
    # Skrypt sam sprawdza harmonogram i wykonuje sesję natychmiast, gdy nadeszła godzina dla ucznia.
    - cron: '*/10 13-21 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Tryb uruchomienia: due (oczekujące), morning (przegląd 06:30), all (wszyscy), plan (plan dziś), week (plan tydzień), reset (reset planu)'
        required: false
        default: 'due'
        type: choice
        options:
          - 'due'
          - 'test'
          - 'morning'
          - 'stats'
          - 'all'
          - 'plan'
          - 'week'
          - 'reset'
      user:
        description: 'Opcjonalnie: pseudonim lub login konkretnego użytkownika'
        required: false
        default: ''

# Blokada uniemożliwiająca nakładanie się dwóch workflow
concurrency:
  group: instaling-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Twardy limit czasu zadania chroniący przed jakimkolwiek zawieszeniem
    permissions:
      contents: write  # Wymagane do automatycznego commitowania i pushowania danych do GitHuba

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Wczytanie bezpiecznych danych z GitHub Secrets
        env:
          USERS_JSON_SECRET: ${{ secrets.USERS_JSON }}
          CONFIG_JSON_SECRET: ${{ secrets.CONFIG_JSON }}
        run: |
          mkdir -p data
          if [ -n "$USERS_JSON_SECRET" ]; then
            echo "$USERS_JSON_SECRET" > data/users.json
            echo "[+] Wczytano dane kont z GitHub Secrets."
          fi
          if [ -n "$CONFIG_JSON_SECRET" ]; then
            echo "$CONFIG_JSON_SECRET" > data/config.json
            echo "[+] Wczytano konfigurację i webhooki z GitHub Secrets."
          fi

      - name: Instalacja zależności i przeglądarki Chromium
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Uruchomienie testów automatycznych (Pre-Flight Checks)
        run: |
          python test_bot.py

      - name: Wykonanie bota InstaLing (Europe/Warsaw)
        env:
          INSTALING_LOGIN: ${{ secrets.INSTALING_LOGIN }}
          INSTALING_PASSWORD: ${{ secrets.INSTALING_PASSWORD }}
          RUN_MODE: ${{ github.event.inputs.mode || 'due' }}
          TARGET_USER: ${{ github.event.inputs.user || '' }}
        run: |
          if [ "$RUN_MODE" = "test" ]; then
            python test_bot.py --discord
          elif [ "$RUN_MODE" = "reset" ]; then
            python main.py --reset-schedule
          elif [ "$RUN_MODE" = "morning" ]; then
            python main.py --morning
          elif [ "$RUN_MODE" = "stats" ]; then
            python main.py --stats
          elif [ "$RUN_MODE" = "plan" ]; then
            python main.py --plan
          elif [ "$RUN_MODE" = "week" ]; then
            python main.py --week
          elif [ "$RUN_MODE" = "all" ]; then
            python main.py --run-all
          elif [ -n "$TARGET_USER" ]; then
            python main.py --user "$TARGET_USER"
          else
            # Domyślny inteligentny tryb: obsłuży poranny przegląd lub sesję wg harmonogramu
            python main.py --cron
          fi

      - name: Zapisanie zaktualizowanego harmonogramu, słówek i historii (Auto-Commit)
        run: |
          git config --global user.name "InstaLing Bot"
          git config --global user.email "bot@github-actions.internal"
          git add -f data/weekly_schedule.json data/words.json data/history.json PLAN_TYGODNIA.md data/PLAN_TYGODNIA.md 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto: Aktualizacja planu tygodnia i stanu sesji [skip ci]"
            git pull --rebase --autostash origin main || git pull --rebase --autostash origin master || true
            git push origin HEAD || true
          fi
